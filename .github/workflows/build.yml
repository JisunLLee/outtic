name: Build Windows EXE

on:
  push:
    branches: [ "v.2.3.0" ]

jobs:
  build:
    runs-on: windows-latest

    # Node.js 관련 경고 해결을 위한 환경 변수 추가
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 안정적인 3.11 권장

    - name: Install Poetry
      run: |
        pip install poetry

    - name: Install dependencies
      run: |
        # 윈도우 빌드 환경에서 의존성 설치 문제를 피하기 위해 추가
        poetry config virtualenvs.create false
        poetry install --no-interaction --no-ansi

    - name: Build EXE with PyInstaller
      run: |
        # pynput 모듈 인식을 확실히 하기 위해 --collect-all 옵션 추가 가능
        poetry run pyinstaller --onefile --noconsole --clean run_auttic.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Executable
        path: dist/run_auttic.exe
